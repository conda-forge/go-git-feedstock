schema_version: 1

context:
  version: "5.16.5"

package:
  name: go-git
  version: ${{ version }}

source:
  url: https://github.com/go-git/go-git/archive/v${{ version }}.tar.gz
  sha256: a11ff799357d9d0e0f253ce50ffa908ee014ce02eca54718dba17da5e486a45d

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - go-git version

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files/
  summary: A golang formatter that fixes long lines
  homepage: https://github.com/go-git/go-git
  repository: https://github.com/go-git/go-git

extra:
  recipe-maintainers:
    - danielnachun
